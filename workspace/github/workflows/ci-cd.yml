name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      run: |
        python manage.py test

    - name: Set up Node.js
      uses: actions/setup-node@v2      with:
        node-version: '14'

    - name: Install frontend dependencies
      run: npm install

    - name: Run frontend tests
      run: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v1      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend Docker image
      run: |
        docker build -t yourusername/admission-portal-backend:latest -f Dockerfile.backend .
        docker push yourusername/admission-portal-backend:latest

    - name: Build and push frontend Docker image
      run: |
        docker build -t yourusername/admission-portal-frontend:latest -f Dockerfile.frontend .
        docker push yourusername/admission-portal-frontend:latest

    - name: Deploy to Kubernetes
      uses: steebchen/kubectl@v1.10.0      with:
        args: apply -f k8s/deployment.yaml
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
